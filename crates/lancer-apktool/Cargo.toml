[package]
name = "lancer-apktool"
description = "Rust clone of apktool with a native GUI — part of the Lancer toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "lancer-apktool"
path = "src/main.rs"

[[bin]]
name = "lancer-apktool-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[dependencies]
apktool-core.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true

eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
