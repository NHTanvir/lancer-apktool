[workspace]
resolver = "2"
members = [
    "crates/lancer-apktool",
    "crates/apktool-core",
    "crates/smali",
    "crates/axml",
    "crates/arsc",
    "crates/apksig",
    "crates/aapt2-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
repository = "https://github.com/NHTanvir/lancer-apktool"

[workspace.dependencies]
# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Binary format helpers
byteorder = "1.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Zip / compression
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

# Hashing (signing digests)
sha1 = "0.10"
sha2 = "0.10"

# CLI / async
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# Filesystem helpers
walkdir = "2"
directories = "5"

# GUI stack
eframe = { version = "0.28", default-features = true }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
rfd = "0.14"

# Internal crates
apktool-core = { path = "crates/apktool-core" }
smali = { path = "crates/smali" }
axml = { path = "crates/axml" }
arsc = { path = "crates/arsc" }
apksig = { path = "crates/apksig" }
aapt2-bridge = { path = "crates/aapt2-bridge" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
